<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Planche Project</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body, html { background: #0a0e1a; font-family: 'Outfit', -apple-system, sans-serif; color: #e2e8f0; }
  .display { font-family: 'Anton', 'Outfit', sans-serif; letter-spacing: 0.02em; }
  ::-webkit-scrollbar { height: 0; width: 0; }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; }

  .app { min-height: 100vh; background: linear-gradient(180deg, #0a0e1a 0%, #0f172a 100%); padding-bottom: 40px; }

  .header {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    padding: 20px 16px 16px;
    border-bottom: 1px solid rgba(251, 191, 36, 0.15);
    position: sticky; top: 0; z-index: 30;
    backdrop-filter: blur(12px);
  }

  .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .title { font-size: 26px; color: #fbbf24; line-height: 1; margin-bottom: 4px; }
  .subtitle { font-size: 10px; color: #64748b; letter-spacing: 0.15em; text-transform: uppercase; }

  .icon-btn {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: #cbd5e1; border-radius: 8px; padding: 8px 10px; font-size: 14px;
  }
  .icon-btn:active { transform: scale(0.95); }

  .progress-section { margin-bottom: 14px; }
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .progress-label { font-size: 10px; color: #94a3b8; letter-spacing: 0.1em; }
  .progress-pct { font-size: 18px; color: #fbbf24; }
  .progress-bar { height: 5px; background: rgba(251, 191, 36, 0.1); border-radius: 999px; overflow: hidden; }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 100%);
    border-radius: 999px; transition: width 0.4s ease;
    box-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
  }

  /* Quarter tabs */
  .quarter-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .quarter-tab {
    flex: 1; padding: 10px 4px; border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: #94a3b8;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: all 0.2s; position: relative;
  }
  .quarter-tab.active { color: #0a0e1a; }
  .quarter-tab:active { transform: scale(0.97); }
  .q-name { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; }
  .q-label { font-size: 9px; opacity: 0.85; }
  .q-pct { position: absolute; top: 4px; right: 6px; font-size: 9px; font-weight: 700; opacity: 0.7; }

  /* Week tabs */
  .week-tabs { overflow-x: auto; display: flex; gap: 6px; padding: 4px; margin: 0 -4px -4px; }
  .week-tab {
    flex-shrink: 0; min-width: 50px;
    padding: 7px 4px 5px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 9px;
    color: #e2e8f0;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    position: relative; transition: all 0.2s;
  }
  .week-tab.active { color: #0a0e1a; }
  .week-tab:active { transform: scale(0.95); }
  .tab-label { font-size: 8px; opacity: 0.7; letter-spacing: 0.05em; }
  .tab-num { font-size: 16px; line-height: 1; }
  .tab-pct { font-size: 8px; font-weight: 600; opacity: 0.6; }
  .week-tab.active .tab-pct { opacity: 0.9; }
  .trophy { position: absolute; top: 2px; right: 3px; font-size: 9px; }

  .content { padding: 20px 16px 0; }

  .phase-info { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .phase-badge {
    display: inline-block; padding: 6px 12px;
    border-radius: 999px; font-size: 11px;
    letter-spacing: 0.1em; font-weight: 600; text-transform: uppercase;
  }
  .phase-meta { font-size: 12px; color: #64748b; }

  .week-title { font-size: 38px; color: #f8fafc; line-height: 1; margin-bottom: 4px; }
  .week-meta { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }

  .quarter-goal {
    background: rgba(251, 191, 36, 0.06);
    border: 1px solid rgba(251, 191, 36, 0.2);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 20px;
    font-size: 13px; color: #fbbf24;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .quarter-goal-icon { font-size: 16px; }

  .days { display: flex; flex-direction: column; gap: 12px; }

  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .day-card {
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    animation: slideIn 0.3s ease-out backwards;
  }
  .day-card.done { border-color: var(--day-color); }
  .day-stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }

  .day-header { padding: 14px 16px 12px 20px; display: flex; align-items: center; justify-content: space-between; }
  .day-header-left { display: flex; align-items: baseline; gap: 12px; }
  .day-name { font-size: 22px; line-height: 1; }
  .day-focus { font-size: 13px; color: #cbd5e1; font-weight: 500; }
  .star { font-size: 14px; }
  .day-count {
    font-size: 11px; color: #64748b; font-weight: 600;
    padding: 3px 8px; border-radius: 999px;
  }
  .day-count.done-count { color: var(--day-color); background: color-mix(in srgb, var(--day-color) 15%, transparent); }

  .rest-text { padding: 0 20px 16px; font-size: 13px; color: #64748b; font-style: italic; }

  .ex-row {
    padding: 12px 16px 12px 20px;
    display: flex; align-items: center; gap: 12px;
    border-top: 1px solid rgba(255,255,255,0.04);
    transition: background 0.15s;
  }

  .checkbox {
    background: none; border: none; padding: 0;
    color: #475569; display: flex; align-items: center;
    width: 28px; height: 28px; flex-shrink: 0;
    transition: all 0.2s;
  }
  .checkbox.checked { color: var(--day-color); }
  .checkbox:active { transform: scale(0.9); }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .checkbox.popping { animation: pop 0.3s ease; }
  .checkbox svg { width: 26px; height: 26px; }

  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-size: 14px; color: #e2e8f0; font-weight: 500; line-height: 1.3; }
  .ex-name.checked { color: #64748b; text-decoration: line-through; }
  .ex-reps { font-size: 12px; color: #64748b; margin-top: 2px; font-weight: 600; }

  .video-btn {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.25);
    color: #ef4444;
    border-radius: 8px;
    padding: 7px 10px;
    display: flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600;
    flex-shrink: 0;
  }
  .video-btn:active { transform: scale(0.92); }

  .nav { display: flex; gap: 10px; margin-top: 24px; }
  .nav-btn {
    flex: 1; padding: 14px; border-radius: 12px;
    font-size: 13px; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04); color: #cbd5e1;
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .nav-btn.next {
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    border: none; color: #0a0e1a; font-weight: 700;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(16, 185, 129, 0.15); color: #10b981;
    padding: 6px 14px; border-radius: 999px; font-size: 11px;
    border: 1px solid rgba(16, 185, 129, 0.3); font-weight: 600;
    animation: pulse 1s infinite; z-index: 50;
    pointer-events: none; opacity: 0;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }

  .menu-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100;
    display: none; align-items: flex-end; justify-content: center;
  }
  .menu-backdrop.open { display: flex; }
  .menu {
    background: #1e293b; border-radius: 20px 20px 0 0;
    width: 100%; max-width: 500px; padding: 20px;
  }
  .menu-title { font-size: 18px; color: #fbbf24; margin-bottom: 14px; }
  .menu-btn {
    width: 100%; text-align: left; padding: 14px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: #e2e8f0; border-radius: 12px;
    font-size: 14px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .menu-btn.danger { color: #ef4444; border-color: rgba(239,68,68,0.2); background: rgba(239,68,68,0.05); }
  .menu-close {
    width: 100%; padding: 12px;
    background: transparent; border: none;
    color: #94a3b8; font-size: 13px; margin-top: 4px;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast">✓ Salvo</div>
<div id="menu" class="menu-backdrop" onclick="closeMenu(event)">
  <div class="menu" onclick="event.stopPropagation()">
    <div class="menu-title">Opções</div>
    <button class="menu-btn" onclick="exportData()">
      <span>📥</span> Exportar progresso (backup)
    </button>
    <button class="menu-btn" onclick="document.getElementById('import-file').click()">
      <span>📤</span> Importar progresso
    </button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
    <button class="menu-btn danger" onclick="resetAll()">
      <span>🗑️</span> Resetar tudo
    </button>
    <button class="menu-close" onclick="closeMenu()">Fechar</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'planche-progress-v1';
const yt = (q) => `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`;

// PLANCHE-SPECIFIC EXERCISES
const EX = {
  // Punho/aquecimento
  wrist: { n: 'Aquecimento de punhos (3 min)', v: yt('wrist warmup planche') },
  wristProg: { n: 'Wrist conditioning progressivo', v: yt('wrist preparation calisthenics') },

  // Push básico
  flex: { n: 'Flexão tradicional', v: yt('flexão tradicional técnica') },
  flexD: { n: 'Flexão diamante', v: yt('flexão diamante tríceps') },
  flexI: { n: 'Flexão inclinada (mãos na cadeira)', v: yt('flexão inclinada iniciante') },
  flexDec: { n: 'Flexão declinada (pés no sofá)', v: yt('flexão declinada') },
  merg: { n: 'Mergulho em cadeira', v: yt('mergulho cadeira tríceps') },
  pike: { n: 'Pike push-up', v: yt('pike push up') },

  // Planche progressions - SKILL
  scapPush: { n: 'Scapular push-up (protração)', v: yt('scapular push up protraction') },
  planLean: { n: 'Planche Lean (inclinação)', v: yt('planche lean tutorial') },
  planLeanD: { n: 'Planche Lean profundo', v: yt('deep planche lean') },
  ppp: { n: 'Pseudo Planche Push-up (PPP)', v: yt('pseudo planche push up tutorial') },
  pppD: { n: 'PPP profundo (mãos mais atrás)', v: yt('advanced pseudo planche push up') },
  frog: { n: 'Frog Stand / Crow Pose', v: yt('frog stand crow pose tutorial') },
  frogToL: { n: 'Frog Stand → Tuck Planche', v: yt('frog stand to tuck planche') },
  tuck: { n: 'Tuck Planche Hold', v: yt('tuck planche hold tutorial') },
  tuckAdv: { n: 'Advanced Tuck Planche', v: yt('advanced tuck planche') },
  tuckPush: { n: 'Tuck Planche Push-up', v: yt('tuck planche push up') },
  straddle: { n: 'Straddle Planche Hold', v: yt('straddle planche hold') },
  straddleN: { n: 'Negativa de Straddle Planche', v: yt('straddle planche negative') },
  straddlePush: { n: 'Straddle Planche Push-up', v: yt('straddle planche push up') },
  fullN: { n: 'Negativa de Full Planche', v: yt('full planche negative') },
  fullHold: { n: 'Full Planche Hold (tentativas)', v: yt('full planche hold') },
  fullPush: { n: 'Full Planche Push-up (tentativas)', v: yt('full planche push up tutorial') },

  // Core
  prancha: { n: 'Prancha', v: yt('prancha abdominal') },
  hollow: { n: 'Hollow body hold', v: yt('hollow body hold') },
  hollowR: { n: 'Hollow rocks', v: yt('hollow rocks') },
  vsit: { n: 'V-sit hold', v: yt('v-sit hold') },
  Lsit: { n: 'L-sit (cadeiras)', v: yt('L sit progression') },
  deadBug: { n: 'Dead bug', v: yt('dead bug exercício') },
  mc: { n: 'Mountain climber', v: yt('mountain climber') },

  // Pernas (pra não atrofiar)
  agach: { n: 'Agachamento livre', v: yt('agachamento livre técnica') },
  afundo: { n: 'Afundo (passada)', v: yt('afundo passada') },
  bulgaro: { n: 'Búlgaro com cadeira', v: yt('agachamento búlgaro cadeira') },
  ponte: { n: 'Ponte de glúteo (1 perna)', v: yt('single leg glute bridge') },
  pistolP: { n: 'Pistol squat progressão', v: yt('pistol squat progressão') },

  // Mobilidade
  along: { n: 'Mobilidade ombro/punho/peito (15 min)', v: yt('mobilidade ombro punho calistenia') },
  alongP: { n: 'Mobilidade específica para planche', v: yt('mobility for planche') },

  // Full body
  burpee: { n: 'Burpee', v: yt('burpee técnica') },
};

// Quarters definition with theme color and focus
const QUARTERS = [
  { id: 1, name: 'T1', label: 'Fundação', color: '#10b981',
    goal: 'Construir força base, condicionamento de punhos e dominar Planche Lean + Frog Stand.' },
  { id: 2, name: 'T2', label: 'Tuck Planche', color: '#3b82f6',
    goal: 'Dominar Tuck Planche Hold (joelhos no peito) por 20-30s e iniciar Tuck Push-ups.' },
  { id: 3, name: 'T3', label: 'Advanced + Straddle', color: '#8b5cf6',
    goal: 'Advanced Tuck Planche (joelhos longe do peito) e primeiras tentativas de Straddle.' },
  { id: 4, name: 'T4', label: 'Full Planche Push-up', color: '#ef4444',
    goal: 'Straddle Planche + Full Planche Negatives → tentativas de Full Planche Push-up.' },
];

function getQuarter(week) {
  if (week <= 13) return QUARTERS[0];
  if (week <= 26) return QUARTERS[1];
  if (week <= 39) return QUARTERS[2];
  return QUARTERS[3];
}

// Build week structure based on phase progression
function buildWeek(n) {
  const q = getQuarter(n);
  const wInQ = n - (q.id - 1) * 13; // 1-13 within the quarter

  // ===== WED (PLANCHE SKILL DAY) - varies by quarter =====
  let qua;
  if (q.id === 1) {
    // Fundação - lean, frog, scap
    const leanSec = 10 + Math.min(wInQ * 2, 30);
    const frogSec = 5 + Math.min(wInQ * 2, 25);
    qua = [
      { ex: EX.wrist, r: '3 min' },
      { ex: EX.scapPush, r: '3x10' },
      { ex: EX.planLean, r: `4x${leanSec}s` },
      { ex: EX.frog, r: `3x${frogSec}s (acumular)` },
      { ex: EX.ppp, r: `3x${5 + Math.floor(wInQ/2)}` },
    ];
  } else if (q.id === 2) {
    // Tuck Planche focus
    const tuckSec = 5 + Math.min(wInQ * 2, 25);
    qua = [
      { ex: EX.wrist, r: '3 min' },
      { ex: EX.planLeanD, r: '4x30s' },
      { ex: EX.frogToL, r: '3x5 transições' },
      { ex: EX.tuck, r: `5x${tuckSec}s` },
      { ex: EX.ppp, r: `4x${7 + Math.floor(wInQ/2)}` },
      ...(wInQ >= 7 ? [{ ex: EX.tuckPush, r: '3x3-5' }] : []),
    ];
  } else if (q.id === 3) {
    // Advanced Tuck + Straddle intro
    const advSec = 5 + Math.min(wInQ * 1.5, 20);
    qua = [
      { ex: EX.wrist, r: '3 min' },
      { ex: EX.tuck, r: '4x30s (aquecimento)' },
      { ex: EX.tuckAdv, r: `5x${Math.round(advSec)}s` },
      { ex: EX.tuckPush, r: '4x5-7' },
      { ex: EX.pppD, r: '4x8' },
      ...(wInQ >= 5 ? [{ ex: EX.straddle, r: '3x3-8s (tentativas)' }] : []),
    ];
  } else {
    // Straddle + Full Planche attempts
    const stradSec = 3 + Math.min(wInQ, 12);
    qua = [
      { ex: EX.wrist, r: '3 min' },
      { ex: EX.tuckAdv, r: '4x20s (aquecimento)' },
      { ex: EX.straddle, r: `5x${stradSec}s` },
      { ex: EX.straddleN, r: '4x2-3 (descida lenta)' },
      { ex: EX.pppD, r: '4x10' },
      ...(wInQ >= 5 ? [{ ex: EX.fullN, r: '3x1-2 tentativas' }] : []),
      ...(wInQ >= 10 ? [{ ex: EX.fullPush, r: 'Tentativas livres' }] : []),
    ];
  }

  // ===== MON (PUSH) =====
  let seg;
  if (q.id === 1) {
    seg = [
      { ex: EX.flex, r: `3x ${wInQ <= 5 ? 'máximo' : 'máximo +2'}` },
      { ex: EX.flexD, r: `3x${8 + wInQ}` },
      { ex: EX.merg, r: '3x10-12' },
      { ex: EX.pike, r: '3x8' },
    ];
  } else if (q.id === 2) {
    seg = [
      { ex: EX.flexDec, r: '4x10-12' },
      { ex: EX.flexD, r: '4x12' },
      { ex: EX.pike, r: '4x10' },
      { ex: EX.ppp, r: '3x6' },
    ];
  } else if (q.id === 3) {
    seg = [
      { ex: EX.flexDec, r: '4x15' },
      { ex: EX.flexD, r: '4x15' },
      { ex: EX.pike, r: '4x12' },
      { ex: EX.pppD, r: '4x6-8' },
    ];
  } else {
    seg = [
      { ex: EX.flexDec, r: '4x15-20' },
      { ex: EX.flexD, r: '4x15-20' },
      { ex: EX.pike, r: '4x15' },
      { ex: EX.tuckPush, r: '3x5-7' },
    ];
  }

  // ===== TUE (CORE + WRIST) =====
  let ter;
  if (q.id === 1) {
    ter = [
      { ex: EX.wristProg, r: '5 min' },
      { ex: EX.hollow, r: `3x${20 + wInQ * 2}s` },
      { ex: EX.prancha, r: `3x${40 + wInQ * 3}s` },
      { ex: EX.deadBug, r: '3x10' },
      { ex: EX.mc, r: '3x30s' },
    ];
  } else if (q.id === 2) {
    ter = [
      { ex: EX.wristProg, r: '5 min' },
      { ex: EX.hollowR, r: '4x20' },
      { ex: EX.Lsit, r: '4x10-15s' },
      { ex: EX.prancha, r: '3x60s' },
      { ex: EX.mc, r: '3x40s' },
    ];
  } else {
    ter = [
      { ex: EX.wristProg, r: '5 min' },
      { ex: EX.Lsit, r: '5x15-20s' },
      { ex: EX.vsit, r: '4x10s' },
      { ex: EX.hollowR, r: '4x25' },
      { ex: EX.prancha, r: '3x60s' },
    ];
  }

  // ===== FRI (LEGS) =====
  const sex = q.id <= 2
    ? [
        { ex: EX.agach, r: '3x20' },
        { ex: EX.afundo, r: '3x10 cada perna' },
        { ex: EX.bulgaro, r: '3x10 cada perna' },
        { ex: EX.ponte, r: '3x12 cada perna' },
      ]
    : [
        { ex: EX.agach, r: '4x20' },
        { ex: EX.pistolP, r: '4x5 cada perna' },
        { ex: EX.bulgaro, r: '4x12 cada perna' },
        { ex: EX.ponte, r: '3x15 cada perna' },
      ];

  // ===== SAT (FULL BODY / SKILL) =====
  const sab = [
    { ex: EX.planLean, r: '3x30s' },
    { ex: EX.ppp, r: '3x8' },
    { ex: EX.frog, r: '3x20s' },
    { ex: EX.burpee, r: '3x10' },
  ];

  // ===== Days array =====
  return {
    n, quarter: q.id, phaseColor: q.color, phaseName: q.label,
    days: [
      { day: 'SEG', focus: 'Push (peito/tríceps/ombro)', color: '#ef4444', exs: seg },
      { day: 'TER', focus: 'Core + Punhos', color: '#f59e0b', exs: ter },
      { day: 'QUA', focus: 'PLANCHE — DIA PRINCIPAL', color: q.color, isStar: true, exs: qua },
      { day: 'QUI', focus: 'Mobilidade / Descanso ativo', color: '#10b981',
        exs: [{ ex: EX.alongP, r: '15 min' }] },
      { day: 'SEX', focus: 'Pernas', color: '#3b82f6', exs: sex },
      { day: 'SAB', focus: 'Skill day (planche prática)', color: '#ec4899', exs: sab },
      { day: 'DOM', focus: 'Descanso total', color: '#64748b', exs: [] },
    ]
  };
}

const WEEKS = Array.from({ length: 52 }, (_, i) => buildWeek(i + 1));

// State
let currentQuarter = 1;
let currentWeek = 1;
let progress = {};

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) progress = JSON.parse(raw);
  } catch (e) { progress = {}; }
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    showToast();
  } catch (e) { console.error(e); }
}

let toastTimer;
function showToast(msg = '✓ Salvo') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1200);
}

function isChecked(w, di, ei) { return !!progress[`w${w}d${di}e${ei}`]; }

function toggleCheck(w, di, ei, btnEl) {
  const key = `w${w}d${di}e${ei}`;
  progress[key] = !progress[key];
  saveProgress();
  if (btnEl) { btnEl.classList.add('popping'); setTimeout(() => btnEl.classList.remove('popping'), 300); }
  // Surgical updates only — don't rebuild the header/tabs
  renderContent();
  updateProgressBar();
}

function weekCompletion(w) {
  const wd = WEEKS[w - 1];
  let total = 0, done = 0;
  wd.days.forEach((d, di) => d.exs.forEach((_, ei) => { total++; if (isChecked(w, di, ei)) done++; }));
  return total === 0 ? 0 : Math.round((done / total) * 100);
}

function quarterCompletion(q) {
  const start = (q - 1) * 13 + 1;
  const end = q * 13;
  let sum = 0;
  for (let w = start; w <= end; w++) sum += weekCompletion(w);
  return Math.round(sum / 13);
}

function overallCompletion() {
  const vals = WEEKS.map((_, i) => weekCompletion(i + 1));
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
}

function setQuarter(q) {
  if (currentQuarter === q) return;
  currentQuarter = q;
  // Jump to first week of new quarter
  currentWeek = (q - 1) * 13 + 1;
  // Rebuild week-tabs (different set of weeks shown) + update everything
  renderWeekTabs();
  updateActiveTabsState();
  updateProgressBar();
  renderContent();
  // Scroll to top makes sense when changing quarter (big context shift)
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setWeek(n) {
  const newQuarter = getQuarter(n).id;
  const quarterChanged = newQuarter !== currentQuarter;
  currentWeek = n;
  currentQuarter = newQuarter;

  if (quarterChanged) {
    // Need to rebuild week-tabs because we're showing a different set
    renderWeekTabs();
  }
  // No DOM rebuild of header/tabs — just update active state + content
  updateActiveTabsState();
  updateProgressBar();
  renderContent();
  // Don't auto-scroll; user picked a week, keep their tab scroll position
}

function openMenu() { document.getElementById('menu').classList.add('open'); }
function closeMenu(e) {
  if (e && e.target.id !== 'menu') return;
  document.getElementById('menu').classList.remove('open');
}

function resetAll() {
  if (confirm('Resetar TODO o progresso? Esta ação é permanente.')) {
    progress = {};
    saveProgress();
    closeMenu();
    mountApp();
  }
}

function exportData() {
  const data = JSON.stringify(progress, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `planche-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  closeMenu();
  showToast('📥 Backup baixado');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (typeof data === 'object' && data !== null) {
        progress = data;
        saveProgress();
        closeMenu();
        mountApp();
        showToast('📤 Importado!');
      }
    } catch (err) {
      alert('Arquivo inválido');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
const ICON_CIRCLE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>`;
const ICON_PLAY = `<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;

// ============================================================
// MODULAR RENDERING - mount once, surgical updates afterwards
// ============================================================

// Mount the initial app structure ONCE. Header is built here and won't
// be torn down by week/checkbox interactions.
function mountApp() {
  document.getElementById('app').innerHTML = `
    <div class="app">
      <div class="header">
        <div class="header-top">
          <div>
            <div class="title display">PLANCHE PROJECT</div>
            <div class="subtitle">Full Planche Push-up · 52 semanas · 4 trimestres</div>
          </div>
          <button class="icon-btn" onclick="openMenu()">⚙️</button>
        </div>
        <div class="progress-section">
          <div class="progress-header">
            <div class="progress-label">PROGRESSO GERAL</div>
            <div class="progress-pct display" id="progress-pct">0%</div>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        </div>
        <div class="quarter-tabs" id="quarter-tabs"></div>
        <div class="week-tabs" id="week-tabs"></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  `;
  renderQuarterTabs();
  renderWeekTabs();
  renderContent();
  updateProgressBar();
}

function renderQuarterTabs() {
  const html = QUARTERS.map(qu => {
    const c = quarterCompletion(qu.id);
    const active = currentQuarter === qu.id;
    const style = active ? `background:${qu.color};border-color:${qu.color};` : '';
    return `<button class="quarter-tab ${active ? 'active' : ''}" data-q="${qu.id}" style="${style}" onclick="setQuarter(${qu.id})">
      <div class="q-pct" data-q-pct="${qu.id}">${c}%</div>
      <div class="q-name">${qu.name}</div>
      <div class="q-label">${qu.label}</div>
    </button>`;
  }).join('');
  document.getElementById('quarter-tabs').innerHTML = html;
}

function renderWeekTabs() {
  const q = QUARTERS[currentQuarter - 1];
  const weekStart = (currentQuarter - 1) * 13 + 1;
  const weekEnd = currentQuarter * 13;
  let html = '';
  for (let w = weekStart; w <= weekEnd; w++) {
    const c = weekCompletion(w);
    const active = currentWeek === w;
    const done = c === 100;
    const style = active ? `background:${q.color};border-color:${q.color};` : '';
    html += `<button class="week-tab ${active ? 'active' : ''}" data-w="${w}" style="${style}" onclick="setWeek(${w})">
      <div class="tab-label">SEM</div>
      <div class="tab-num display">${w}</div>
      <div class="tab-pct" data-w-pct="${w}">${c}%</div>
      ${done ? `<div class="trophy" data-w-trophy="${w}">🏆</div>` : ''}
    </button>`;
  }
  document.getElementById('week-tabs').innerHTML = html;
}

// Update only the visual "active" state of tabs and the percentage text,
// without rebuilding tab nodes (preserves scroll position).
function updateActiveTabsState() {
  const q = QUARTERS[currentQuarter - 1];
  // Quarter tabs
  document.querySelectorAll('.quarter-tab').forEach(el => {
    const qid = parseInt(el.dataset.q);
    const qu = QUARTERS[qid - 1];
    if (qid === currentQuarter) {
      el.classList.add('active');
      el.style.background = qu.color;
      el.style.borderColor = qu.color;
    } else {
      el.classList.remove('active');
      el.style.background = '';
      el.style.borderColor = '';
    }
  });
  // Week tabs
  document.querySelectorAll('.week-tab').forEach(el => {
    const wid = parseInt(el.dataset.w);
    if (wid === currentWeek) {
      el.classList.add('active');
      el.style.background = q.color;
      el.style.borderColor = q.color;
    } else {
      el.classList.remove('active');
      el.style.background = '';
      el.style.borderColor = '';
    }
  });
}

// Update progress numbers (overall + quarter + week tab percentages)
// without re-rendering the DOM nodes themselves.
function updateProgressBar() {
  const overall = overallCompletion();
  const pctEl = document.getElementById('progress-pct');
  const fillEl = document.getElementById('progress-fill');
  if (pctEl) pctEl.textContent = overall + '%';
  if (fillEl) fillEl.style.width = overall + '%';

  // Quarter percentages
  QUARTERS.forEach(qu => {
    const el = document.querySelector(`[data-q-pct="${qu.id}"]`);
    if (el) el.textContent = quarterCompletion(qu.id) + '%';
  });

  // Week percentages + trophy state (only for visible week tabs)
  document.querySelectorAll('.week-tab').forEach(el => {
    const wid = parseInt(el.dataset.w);
    const c = weekCompletion(wid);
    const pctEl = el.querySelector('[data-w-pct]');
    if (pctEl) pctEl.textContent = c + '%';
    // Manage trophy badge
    let trophy = el.querySelector('[data-w-trophy]');
    if (c === 100 && !trophy) {
      const t = document.createElement('div');
      t.className = 'trophy';
      t.dataset.wTrophy = wid;
      t.textContent = '🏆';
      el.appendChild(t);
    } else if (c < 100 && trophy) {
      trophy.remove();
    }
  });
}

function renderContent() {
  const week = WEEKS[currentWeek - 1];
  const q = QUARTERS[currentQuarter - 1];
  const exTotal = week.days.reduce((s, d) => s + d.exs.length, 0);

  const daysHtml = week.days.map((d, di) => {
    const total = d.exs.length;
    const done = d.exs.filter((_, ei) => isChecked(currentWeek, di, ei)).length;
    const allDone = total > 0 && done === total;

    const exsHtml = total === 0
      ? `<div class="rest-text">Descanso completo. Recuperação é parte do treino.</div>`
      : d.exs.map((row, ei) => {
          const checked = isChecked(currentWeek, di, ei);
          return `<div class="ex-row">
            <button class="checkbox ${checked ? 'checked' : ''}" onclick="toggleCheck(${currentWeek},${di},${ei},this)">
              ${checked ? ICON_CHECK : ICON_CIRCLE}
            </button>
            <div class="ex-info">
              <div class="ex-name ${checked ? 'checked' : ''}">${row.ex.n}</div>
              <div class="ex-reps">${row.r}</div>
            </div>
            <a href="${row.ex.v}" target="_blank" rel="noopener" class="video-btn">
              ${ICON_PLAY} Vídeo
            </a>
          </div>`;
        }).join('');

    return `<div class="day-card ${allDone ? 'done' : ''}" style="--day-color: ${d.color}; animation-delay: ${di * 0.04}s">
      <div class="day-stripe" style="background:${d.color}"></div>
      <div class="day-header">
        <div class="day-header-left">
          <div class="day-name display" style="color:${d.color}">${d.day}</div>
          <div class="day-focus">${d.focus}</div>
          ${d.isStar ? '<span class="star">🔥</span>' : ''}
        </div>
        ${total > 0 ? `<div class="day-count ${allDone ? 'done-count' : ''}">${done}/${total}</div>` : ''}
      </div>
      ${exsHtml}
    </div>`;
  }).join('');

  const navHtml = `<div class="nav">
    ${currentWeek > 1 ? `<button class="nav-btn" onclick="setWeek(${currentWeek - 1})">← Semana ${currentWeek - 1}</button>` : ''}
    ${currentWeek < 52 ? `<button class="nav-btn next" onclick="setWeek(${currentWeek + 1})">Semana ${currentWeek + 1} →</button>` : ''}
  </div>`;

  document.getElementById('content').innerHTML = `
    <div class="phase-info">
      <div class="phase-badge" style="background:${q.color}20;border:1px solid ${q.color}60;color:${q.color}">
        ${q.name} · ${q.label}
      </div>
      <div class="phase-meta">Semana ${week.n} de 52</div>
    </div>
    <div class="week-title display">SEMANA ${String(week.n).padStart(2, '0')}</div>
    <div class="week-meta">${weekCompletion(week.n)}% concluído · ${exTotal} exercícios</div>
    <div class="quarter-goal">
      <span class="quarter-goal-icon">🎯</span>
      <span><strong>Meta do trimestre:</strong> ${q.goal}</span>
    </div>
    <div class="days">${daysHtml}</div>
    ${navHtml}
  `;
}

loadProgress();
mountApp();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
